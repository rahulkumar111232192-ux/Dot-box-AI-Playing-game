<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot & Box Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="generated-icon.png">
</head>

<body>
    <div class="game-container">
        <h1>Dot & Box Game</h1>
        <div class="player-profiles">
            <div class="player-profile" id="player1-profile">
                <div class="profile-icon" style="background-color: #FF5252;"></div>
                <div>YOU: <span id="player1-score">0</span></div>
            </div>
            <div class="player-profile" id="player2-profile">
                <div class="profile-icon" style="background-color: #4CAF50;"></div>
                <div>Computer: <span id="player2-score">0</span></div>
            </div>
        </div>

        <canvas id="game-board"></canvas>
        <div class="controls">
            <button id="reset-btn">Reset Game</button>
        </div>
    </div>
    <div id="win-popup" class="win-popup hidden">
        <div class="win-popup-content">
            <span id="win-message" class="win-message"></span>
            <button id="win-close-btn">Close</button>
        </div>
    </div>
    <script type="module" src="script.js"></script>
</body>

</html>
